server.port=8080

# Application Name
spring.application.name=mindsmart-platform

# File Upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# MySQL Database Configuration (Default)
spring.datasource.url=jdbc:mysql://localhost:3306/mindsmart_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration (Dialect auto-detected)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Mail Configuration (JavaMailSender)
# Configure SMTP credentials here if an active mail server is available.
# If unconfigured or unreachable, MindSmart automatically switches to Demo Email Simulator mode!
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000

# MindSmart Custom Properties
mindsmart.mail.enabled=false
mindsmart.mail.from=noreply@mindsmart.com
mindsmart.upload.dir=uploads
mindsmart.jwt.secret=9a67c549643a4048a3ca6f2cc41e728d2c8ca018047720d64917a8003c46413d
mindsmart.jwt.expiration-ms=86400000
